[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sre"
version = "0.1.0"
description = "AI-powered Site Reliability Engineering platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "huggingface-hub"
]

[tool.setuptools.packages.find]
include = ["backend*"]
