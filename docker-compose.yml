services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sre-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ai_sre
      POSTGRES_PASSWORD: ai_sre_dev
      POSTGRES_DB: ai_sre

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: